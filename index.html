<title>Spades Scorekeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap" crossorigin>
<style>
:root{
  --bg:#eff1f6; --surface:#ffffff; --surface-2:#e3e7f0; --ink:#121629; --muted:#5a6078; --line:#d3d8e4;
  --accent:#2446c7; --accent-ink:#ffffff; --ta:#2446c7; --tb:#b45309;
  --lead:#e8edfc; --good:#1f7a4d; --warn:#b45309; --warn-bg:#fdf1e3; --err:#b3261e; --err-bg:#fdeceb;
  --shadow:0 1px 2px rgba(18,22,41,.06),0 6px 18px rgba(18,22,41,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0d0f1a; --surface:#161a2b; --surface-2:#1f2438; --ink:#eceffa; --muted:#9aa1bd; --line:#2c3350;
  --accent:#7d98ff; --accent-ink:#0d0f1a; --ta:#7d98ff; --tb:#f59e4b;
  --lead:#1c2447; --good:#5fd39a; --warn:#f5a35c; --warn-bg:#3a2614; --err:#f28b82; --err-bg:#3b1e1c;
  --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0f1a; --surface:#161a2b; --surface-2:#1f2438; --ink:#eceffa; --muted:#9aa1bd; --line:#2c3350;
  --accent:#7d98ff; --accent-ink:#0d0f1a; --ta:#7d98ff; --tb:#f59e4b;
  --lead:#1c2447; --good:#5fd39a; --warn:#f5a35c; --warn-bg:#3a2614; --err:#f28b82; --err-bg:#3b1e1c;
  --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Figtree",system-ui,sans-serif;padding-inline:16px;padding-block:18px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:19px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:38px;height:38px;flex:none}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
button,select{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;font-weight:600}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:17px;padding:14px}
.ghost{background:transparent}
.small{padding:6px 10px;font-size:14px}
.danger{color:var(--err);border-color:var(--err)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
input[type=text],select{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.hint{font-size:14px;color:var(--muted);margin:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>*{flex:1}
.ta{color:var(--ta)} .tb{color:var(--tb)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot.a{background:var(--ta)} .dot.b{background:var(--tb)}

/* setup */
.teamset{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lbl{font-size:13px;font-weight:700;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:8px 12px;border-radius:999px;font-size:14px}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.toggle .tl{font-weight:600}
.toggle .ts{display:block;font-size:13px;color:var(--muted);font-weight:400}
.switch{width:52px;height:30px;border-radius:999px;padding:0;position:relative;background:var(--surface-2);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{left:25px}

/* teams */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);border-top:4px solid var(--ta)}
.team.b{border-top-color:var(--tb)}
.team.lead{background:var(--lead)}
.tname{font-weight:800;font-size:16px;overflow-wrap:anywhere}
.tplayers{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.score{font-family:"Bricolage Grotesque",sans-serif;font-size:38px;font-weight:800;line-height:1.05}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.gap{font-size:13px;font-weight:700;color:var(--muted)}
.team.lead .gap{color:var(--accent)}

/* strip */
.strip{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:14px;background:var(--surface-2)}
.strip .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px}
.push{border:2px solid var(--accent);border-radius:14px;padding:14px 16px;background:var(--surface)}
.push .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;text-wrap:balance}

/* entry */
.prow{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.prow:last-of-type{border-bottom:0}
.phead{display:flex;align-items:baseline;gap:8px}
.phead .pn{font-weight:800;overflow-wrap:anywhere}
.phead .pick{margin-left:auto;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px;white-space:nowrap}
.phead .auto{font-size:12px;font-weight:700;color:var(--accent);margin-left:6px}
.sublbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.grid13{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.grid13 button{padding:0;height:40px;font-size:16px;font-variant-numeric:tabular-nums;border-radius:8px}
.grid13 button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid13 button.auto[aria-pressed="true"]{background:var(--lead);color:var(--accent);border:2px dashed var(--accent)}
.grid13 .nil{grid-column:span 2;font-size:14px}
.sumline{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;font-weight:700;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.sumline.bad{background:var(--err-bg);color:var(--err)}
.sumline.ok{background:var(--lead);color:var(--accent)}
.err{background:var(--err-bg);color:var(--err);padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px}
.contract{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.contract:first-of-type{border-top:0}
.contract .cn{font-weight:800}
.contract .cb{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;text-align:right;grid-row:1 / 3;grid-column:2}
.contract .cd{font-size:13px;color:var(--muted)}

/* history */
.hcard{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.hcard:first-of-type{border-top:0;padding-top:0}
.hhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hmeta{font-size:13px;color:var(--muted)}
.hrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.hrow .ht{font-weight:700;overflow-wrap:anywhere}
.hrow .hs{font-weight:800;text-align:right}
.hrow .bd{grid-column:1 / 3;font-size:13px;color:var(--muted);line-height:1.5}
.pos{color:var(--good)} .neg{color:var(--err)}

.banner{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.banner h2{font-size:26px;font-weight:800}
.banner button{background:var(--surface);color:var(--ink);border-color:var(--surface)}
details.rules{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
details.rules summary{cursor:pointer;font-weight:700}
.rulelist{font-size:14px;margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

/* stats */
.hl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aw{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:2px}
.aw .an{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:800}
.aw .ah{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px;overflow-wrap:anywhere}
.aw .ad{font-size:13px;color:var(--muted)}
.stwrap{overflow-x:auto}
table.st{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
table.st th,table.st td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.st th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
table.st th:first-child,table.st td:first-child{text-align:left}
@media (max-width:380px){.hl{grid-template-columns:1fr}}

/* hx:css:start */
/* game history (shared) */
.hx-hbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.hx{display:flex;flex-direction:column;gap:18px;--hx-acc:var(--accent,var(--gold,var(--amber,#8a5a00)));--hx-bad:var(--err,var(--red,var(--bad,#b3261e)))}
.hx-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hx-top h1{margin:0}
.hx .stwrap{overflow-x:auto}
.hx table.st{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
.hx table.st th,.hx table.st td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
.hx table.st th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.hx table.st th:first-child,.hx table.st td:first-child{text-align:left}
.hx select{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.hx-awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hx-award{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:2px;min-width:0}
.hx-an{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--hx-acc);font-weight:800}
.hx-aw{font-weight:800;font-size:18px;overflow-wrap:anywhere}
.hx-ad{font-size:13px;color:var(--muted)}
.hx-log{display:flex;flex-direction:column}
.hx-game{display:flex;flex-direction:column;gap:6px;padding-block:12px;border-top:1px solid var(--line)}
.hx-game:first-child{border-top:0;padding-top:0}
.hx-meta{display:flex;flex-direction:column;gap:2px}
.hx-scores{font-size:15px;overflow-wrap:anywhere}
.hx-win{color:var(--hx-acc);font-weight:700}
.hx-tag{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border:1px solid currentColor;border-radius:6px;padding:0 5px;margin-right:4px}
.hx-btns>*{flex:0 0 auto}
.hx-card{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.hx-sc td{line-height:1.25}
.hx table.hx-sc th{white-space:normal;min-width:48px}
.hx table.hx-sc th:first-child{min-width:0}
.hx-run{display:block;font-size:11px;color:var(--muted);font-weight:400}
.hx-tot td{font-weight:800;border-bottom:0}
.hx-won{color:var(--hx-acc)}
.hx-nudge{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--hx-acc);border-radius:12px;background:var(--surface);font-size:14px;font-weight:600}
.hx-link{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--hx-acc);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.hx .danger{color:var(--hx-bad);border-color:var(--hx-bad)}
/* hx:css:end */
</style>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
const KEY = "spades-scorekeeper-v1";
const SPADE = `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="var(--accent)"/><path transform="translate(19 17) scale(.62)" d="M50 4 C 34 26, 6 40, 6 60 C 6 77, 25 85, 40 74 C 38 84, 33 91, 25 96 L 75 96 C 67 91, 62 84, 60 74 C 75 85, 94 77, 94 60 C 94 40, 66 26, 50 4 Z" fill="var(--accent-ink)"/></svg>`;
const DEFAULT_RULES = { target:500, mercy:false, nil:true, blind:false, bags:true };

const blankSetup = () => ({ teams:[{name:"",p:["",""]},{name:"",p:["",""]}], firstDealer:0, rules:{...DEFAULT_RULES} });
let state = load() || { phase:"setup", setup:blankSetup(), teams:[], rules:{...DEFAULT_RULES}, dealer0:0, hands:[], pending:null };
let entry = null;
let confirmKey = null, confirmTimer = null;

function load(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Math.abs(n).toLocaleString("en-US");
const signed = n => (n < 0 ? "−" : "+") + fmt(n);
const plain = n => (n < 0 ? "−" : "") + fmt(n);

// Seats go around the table: A1, B1, A2, B2. Player p is on team p % 2.
const teamOf = p => p % 2;
const tcls = t => t === 0 ? "a" : "b";
function tName(teams, t){ return (teams[t].name||"").trim() || (t===0 ? "Us" : "Them"); }
function pName(teams, p){ const t = teams[teamOf(p)], k = Math.floor(p/2); return (t.p[k]||"").trim() || `${tName(teams,teamOf(p))} ${k+1}`; }
const P = p => esc(pName(state.teams, p));
const T = t => esc(tName(state.teams, t));
const dealerOf = h => (state.dealer0 + h) % 4;
const bidLabel = (v, blind) => v === 0 ? (blind ? "Blind nil" : "Nil") : String(v);

// ---------- scoring ----------
function scoreHand(h, t){
  const R = state.rules, ps = [t, t+2];
  let cBid = 0, cTricks = 0, nilTricks = 0, nilPts = 0; const nils = [];
  ps.forEach(p => {
    if (h.bids[p] === 0){
      const blind = !!h.blind[p], val = blind ? 200 : 100, made = h.tricks[p] === 0;
      nilPts += made ? val : -val; nilTricks += h.tricks[p];
      nils.push({ p, blind, made, pts: made ? val : -val });
    } else { cBid += h.bids[p]; cTricks += h.tricks[p]; }
  });
  let cPts = 0, bags = 0, made = null;
  if (cBid > 0){
    made = cTricks >= cBid;
    if (made){ bags = cTricks - cBid; cPts = 10*cBid; }
    else cPts = -10*cBid;
  }
  bags += nilTricks; // tricks taken by a nil bidder count as bags, worth no points
  return { cBid, cTricks, made, cPts, nils, nilPts, bags, pts: cPts + nilPts, nilTricks, overBags: made ? cTricks - cBid : 0 };
}
function run(){
  const score = [0,0], bags = [0,0], details = [];
  state.hands.forEach(h => {
    const d = [0,1].map(t => {
      const s = scoreHand(h, t);
      let penalty = 0;
      if (state.rules.bags){
        bags[t] += s.bags;
        while (bags[t] >= 10){ bags[t] -= 10; penalty -= 100; }
      }
      const total = s.pts + penalty;
      score[t] += total;
      return { ...s, penalty, total, running: score[t], bagsAfter: bags[t] };
    });
    details.push(d);
  });
  return { score, bags, details };
}
function result(score){
  const R = state.rules;
  if (R.mercy && (score[0] <= -200 || score[1] <= -200)){
    if (score[0] === score[1]) return null;
    return { winner: score[0] > score[1] ? 0 : 1, how: "mercy" };
  }
  if (Math.max(...score) >= R.target && score[0] !== score[1]) return { winner: score[0] > score[1] ? 0 : 1, how: "target" };
  return null;
}

function confirmThen(key, fn){
  if (confirmKey === key){ clearTimeout(confirmTimer); confirmKey = null; fn(); return; }
  confirmKey = key; render();
  clearTimeout(confirmTimer);
  confirmTimer = setTimeout(()=>{ confirmKey = null; render(); }, 3500);
}

// ---------- screen wake ----------
let wakeLock = null;
async function keepAwake(){
  try{ if (state.phase === "play" && "wakeLock" in navigator && document.visibilityState === "visible" && !wakeLock){
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", ()=>{ wakeLock = null; });
  }}catch(e){ wakeLock = null; }
}
document.addEventListener("visibilitychange", keepAwake);

// ---------- views ----------
function render(){
  const app = document.getElementById("app");
  const focusId = document.activeElement && document.activeElement.id;
  app.innerHTML = state.phase === "setup" ? setupView() : playView();
  if (focusId){ const el = document.getElementById(focusId); if (el) el.focus({preventScroll:true}); }
}
function header(extra=""){ return `<div class="brand"><div class="logo">${SPADE}<h1>Spades</h1></div><div class="hx-hbtns">${hx.button()}${extra}</div></div>`; }

function rulesText(R){
  return `<ul class="rulelist">
    <li>Bids don't have to add up to 13.</li>
    <li>Team bid is both partners' bids added together. Make it: 10 points per trick bid. Miss it (set): minus 10 per trick bid.</li>
    <li>Each trick over your bid is a bag, worth no points.</li>
    ${R.nil?`<li>Nil is scored for that player alone: +100 if they take no tricks, −100 if they take any. Their partner still plays their own bid. Tricks a nil bidder takes count as bags.</li>`:`<li>Nil bids are off.</li>`}
    ${R.nil && R.blind?`<li>Blind nil (bid before looking): +200 or −200.</li>`:""}
    ${R.bags?`<li>Every 10 bags costs 100 points, and the count starts over.</li>`:`<li>Bags don't carry a penalty.</li>`}
    <li>First team to ${R.target} wins. If both pass it, the higher score wins. A tie keeps going.</li>
    ${R.mercy?`<li>A team that falls to −200 loses.</li>`:""}
  </ul>`;
}

function setupView(){
  const su = state.setup, R = su.rules, dt = su.teams;
  const teamBlock = t => `<div class="teamset">
    <label class="lbl" for="tname-${t}"><span class="dot ${tcls(t)}"></span>Team ${t+1}</label>
    <input type="text" id="tname-${t}" data-tname="${t}" placeholder="${t===0?"Us":"Them"}" value="${esc(dt[t].name)}" maxlength="18" autocomplete="off">
    <div class="pair">
      <input type="text" id="p-${t}-0" data-p="${t}-0" placeholder="Partner 1" value="${esc(dt[t].p[0])}" maxlength="14" autocomplete="off" aria-label="Team ${t+1} partner 1">
      <input type="text" id="p-${t}-1" data-p="${t}-1" placeholder="Partner 2" value="${esc(dt[t].p[1])}" maxlength="14" autocomplete="off" aria-label="Team ${t+1} partner 2">
    </div></div>`;
  const opts = [0,1,2,3].map(p=>`<option value="${p}" ${p===su.firstDealer?"selected":""}>${esc(pName(dt,p))}</option>`).join("");
  const sw = (key,label,sub) => `<div class="toggle"><span class="tl">${label}<span class="ts">${sub}</span></span>
    <button class="switch" role="switch" id="sw-${key}" data-act="rule" data-k="${key}" aria-checked="${!!R[key]}" aria-label="${label}"></button></div>`;
  return header() + `
  <div class="panel">
    <div class="eyebrow">Two teams of two</div>
    ${teamBlock(0)}${teamBlock(1)}
    <div class="teamset">
      <label class="lbl" for="first-dealer">First dealer</label>
      <select id="first-dealer">${opts}</select>
      <p class="hint">Partners sit across from each other, so seats go ${esc(pName(dt,0))}, ${esc(pName(dt,1))}, ${esc(pName(dt,2))}, ${esc(pName(dt,3))}.</p>
    </div>
  </div>
  <div class="panel">
    <div class="eyebrow">House rules</div>
    <div class="row"><span class="grow" style="font-weight:600">Play to</span>
      <div class="opts">${[300,500,1000].map(v=>`<button class="opt" id="tg-${v}" data-act="target" data-v="${v}" aria-pressed="${R.target===v}">${v}</button>`).join("")}</div></div>
    <div>
      ${sw("nil","Nil bids","+100 or −100")}
      ${sw("blind","Blind nil","+200 or −200")}
      ${sw("bags","Bag penalty","10 bags costs 100")}
      ${sw("mercy","Lose at −200","Ends the game early")}
    </div>
  </div>
  <button class="primary" data-act="start" id="start">Start game</button>`;
}

function playView(){
  const { score, bags, details } = run();
  const res = result(score);
  const R = state.rules, n = state.hands.length, has = n > 0;
  const max = Math.max(...score);

  let top = "";
  if (res){
    const w = res.winner, l = 1 - w;
    top = `<div class="banner"><div class="eyebrow" style="color:inherit;opacity:.85">Game over · ${n} hand${n===1?"":"s"}</div>
      <h2>${T(w)} win ${plain(score[w])} to ${plain(score[l])}</h2>
      <div>${res.how==="mercy"?`${T(l)} fell to −200.`:`${P(w)} &amp; ${P(w+2)} take it.`}</div>
      <div style="opacity:.9">This game is saved in History.</div>
      <div class="btnrow"><button data-act="rematch" id="rematch">Rematch</button><button data-act="newsetup" id="newsetup2">New teams</button></div></div>`;
  } else if (has){
    const close = [0,1].filter(t => R.target - score[t] <= 100 && R.target - score[t] > 0);
    if (close.length){
      top = `<div class="push"><div class="eyebrow" style="color:var(--accent)">Closing in</div><div class="big num">${close.map(t=>`${T(t)} need${/s$/i.test(tName(state.teams,t))?"":"s"} ${R.target-score[t]}`).join(" · ")}</div></div>`;
    }
  }

  const teams = [0,1].map(t => {
    const lead = has && score[t] === max && score[0] !== score[1];
    const other = score[1-t];
    let gap = "";
    if (has) gap = score[0] === score[1] ? "All square" : lead ? `Leads by ${fmt(score[t]-other)}` : `${fmt(other-score[t])} behind`;
    const tags = [];
    if (R.bags){
      const b = bags[t];
      tags.push(`<span class="tag ${b>=7?"warn":""} num">Bags ${b}/10${b>=7?` · ${10-b} from −100`:""}</span>`);
    }
    if (!res && R.target - score[t] > 0) tags.push(`<span class="tag num">Needs ${fmt(R.target - score[t])}</span>`);
    return `<div class="team ${tcls(t)} ${lead?"lead":""}">
      <div class="tname ${t===0?"ta":"tb"}">${T(t)}</div>
      <div class="tplayers">${P(t)} &amp; ${P(t+2)}</div>
      <div class="score num">${plain(score[t])}</div>
      ${gap?`<div class="gap num">${gap}</div>`:""}
      <div class="tags">${tags.join("")}</div>
    </div>`;
  }).join("");

  // current hand
  let handBlock = "";
  const hIdx = entry && entry.editing != null ? entry.editing : n;
  if (!res || entry){
    const d = dealerOf(hIdx);
    handBlock = `<div class="strip"><span class="eyebrow">Hand ${hIdx+1}</span>
      <span class="big">${P(d)} deals</span>
      <span class="hint">${P((d+1)%4)} bids first and leads. Dealer bids last.</span></div>`;
    if (entry) handBlock += entryView(hIdx);
    else if (state.pending) handBlock += pendingView();
    else handBlock += `<button class="primary" data-act="newHand" id="newHand">Enter bids for hand ${n+1}</button>`;
  }

  let history = "";
  if (has){
    const cards = details.map((d,hi) => {
      const h = state.hands[hi];
      const rows = [0,1].map(t => `<div class="hrow"><span class="ht ${t===0?"ta":"tb"}">${T(t)}</span><span class="hs num ${d[t].total<0?"neg":""}">${signed(d[t].total)}</span>
        <div class="bd num">${breakdown(h,d[t],t)} · <b>Total ${plain(d[t].running)}</b></div></div>`).join("");
      return `<div class="hcard"><div class="hhead"><button class="small" id="edit-${hi}" data-act="edit" data-i="${hi}">Hand ${hi+1}</button>
        <span class="hmeta">${P(dealerOf(hi))} dealt</span></div>${rows}</div>`;
    }).reverse().join("");
    history = `<div class="panel">
      <div class="row"><h2 class="grow">Hands</h2><button class="small" data-act="undo" id="undo">${confirmKey==="undo"?"Tap to confirm":"Undo last"}</button></div>
      <div>${cards}</div>
      <p class="hint">Newest first. Tap a hand to fix its bids or tricks.</p>
    </div>`;
  }

  const reset = `<button class="small ghost" data-act="newgame" id="newgame">${confirmKey==="new"?"Tap to confirm":"New game"}</button>`;
  return header(reset) + top + `<div class="teams">${teams}</div>` + handBlock + history + statsView() +
    `<details class="rules"><summary>House rules</summary>${rulesText(R)}</details>
     <p class="hint">Every game is saved in History on this device, and the screen stays on while you play.</p>`;
}

function breakdown(h, d, t){
  const parts = [];
  if (d.cBid > 0){
    const who = [t,t+2].filter(p=>h.bids[p]>0).map(p=>`${P(p)} ${h.bids[p]}`).join(", ");
    parts.push(`Bid ${d.cBid} (${who}), took ${d.cTricks}: ${d.made?`<span class="pos">made ${signed(d.cPts)}</span>${d.overBags?`, ${d.overBags} bag${d.overBags===1?"":"s"}`:""}`:`<span class="neg">set ${signed(d.cPts)}</span>`}`);
  }
  d.nils.forEach(x => parts.push(`${P(x.p)} ${x.blind?"blind nil":"nil"} ${x.made?`<span class="pos">${signed(x.pts)}</span>`:`<span class="neg">took ${h.tricks[x.p]}, ${signed(x.pts)}</span>`}`));
  if (d.nilTricks) parts.push(`${d.nilTricks} bag${d.nilTricks===1?"":"s"} from nil tricks`);
  if (d.penalty) parts.push(`<span class="neg">Bag penalty ${signed(d.penalty)}</span>`);
  return parts.join(" · ");
}

function pendingView(){
  const pd = state.pending;
  const rows = [0,1].map(t => {
    const ps = [t,t+2];
    const cBid = ps.reduce((s,p)=> s + (pd.bids[p]>0 ? pd.bids[p] : 0), 0);
    const nils = ps.filter(p=>pd.bids[p]===0);
    const detail = ps.map(p=>`${P(p)} ${bidLabel(pd.bids[p], pd.blind[p])}`).join(" · ");
    return `<div class="contract"><span class="cn ${t===0?"ta":"tb"}">${T(t)}</span>
      <span class="cb num">${cBid ? cBid : "—"}</span>
      <span class="cd">${detail}${nils.length?` · ${nils.map(p=>P(p)).join(" &amp; ")} must take no tricks`:""}</span></div>`;
  }).join("");
  const sum = pd.bids.reduce((a,b)=>a+b,0);
  return `<div class="panel">
    <div class="row"><h2 class="grow">Bids are in</h2><span class="hint num">${sum} of 13 bid</span></div>
    <div>${rows}</div>
    <button class="primary" data-act="tricks" id="enterTricks">Enter tricks taken</button>
    <div class="btnrow"><button class="small" data-act="changeBids" id="changeBids">Change bids</button><button class="small" data-act="cancelHand" id="cancelHand">${confirmKey==="cancelHand"?"Tap to confirm":"Throw in this hand"}</button></div>
  </div>`;
}

function gridFor(kind, p, val, isAuto){
  let html = "";
  if (kind === "bid" && state.rules.nil){
    html += `<button class="nil" id="bid-${p}-nil" data-act="bid" data-p="${p}" data-v="0" aria-pressed="${val===0 && !entry.blind[p]}">Nil</button>`;
    if (state.rules.blind) html += `<button class="nil" id="bid-${p}-blind" data-act="bid" data-p="${p}" data-v="B" aria-pressed="${val===0 && !!entry.blind[p]}">Blind nil</button>`;
  }
  const start = kind === "bid" ? 1 : 0;
  for (let v = start; v <= 13; v++){
    html += `<button id="${kind}-${p}-${v}" data-act="${kind}" data-p="${p}" data-v="${v}" class="${kind==="trick"&&isAuto?"auto":""}" aria-pressed="${val===v}" aria-label="${kind==="bid"?"Bid":"Took"} ${v}">${v}</button>`;
  }
  return `<div class="grid13" role="group" aria-label="${kind==="bid"?"Bid":"Tricks"} for ${P(p)}">${html}</div>`;
}

function entryView(hIdx){
  const mode = entry.mode, d = dealerOf(hIdx);
  const orderP = [1,2,3,4].map(k => (d + k) % 4); // bidding order, dealer last
  const showBids = mode === "bids" || mode === "edit";
  const showTricks = mode === "tricks" || mode === "edit";
  const rows = orderP.map(p => {
    const t = teamOf(p);
    const pick = [];
    if (showBids && entry.bids[p] != null) pick.push(`bid ${bidLabel(entry.bids[p], entry.blind[p])}`);
    if (mode === "tricks") pick.push(`bid ${bidLabel(entry.bids[p], entry.blind[p])}`);
    if (showTricks && entry.tricks[p] != null) pick.push(`took ${entry.tricks[p]}${entry.auto===p?`<span class="auto">auto</span>`:""}`);
    return `<div class="prow">
      <div class="phead"><span class="pn"><span class="dot ${tcls(t)}"></span>${P(p)}</span><span class="hint">${T(t)}</span><span class="pick num">${pick.join(" · ")}</span></div>
      ${showBids?`${mode==="edit"?`<span class="sublbl">Bid</span>`:""}${gridFor("bid", p, entry.bids[p])}`:""}
      ${showTricks?`${mode==="edit"?`<span class="sublbl">Tricks taken</span>`:""}${gridFor("trick", p, entry.tricks[p], entry.auto===p)}`:""}
    </div>`;
  }).join("");

  let sum = "";
  if (showBids){
    const tb = [0,1].map(t => [t,t+2].reduce((s,p)=> s + (entry.bids[p] > 0 ? entry.bids[p] : 0), 0));
    const all = entry.bids.reduce((s,v)=> s + (v || 0), 0);
    sum += `<div class="sumline num"><span class="ta">${T(0)} bid ${tb[0]}</span><span class="tb">${T(1)} bid ${tb[1]}</span><span>${all} of 13 bid</span></div>`;
  }
  if (showTricks){
    const got = entry.tricks.filter(v=>v!=null).length;
    const s = entry.tricks.reduce((a,v)=>a+(v||0),0);
    const cls = got === 4 ? (s === 13 ? "ok" : "bad") : "";
    const msg = got === 4 ? (s === 13 ? "13 of 13 tricks. Ready to post." : `${s} of 13 tricks. Tricks need to add up to 13.`) : `${s} of 13 tricks so far`;
    sum += `<div class="sumline ${cls} num">${msg}</div>`;
  }

  const title = mode === "bids" ? `Bids for hand ${hIdx+1}` : mode === "tricks" ? `Tricks for hand ${hIdx+1}` : `Edit hand ${hIdx+1}`;
  const help = mode === "bids" ? "Tap each player's bid, in bidding order." : mode === "tricks" ? "Tap tricks taken. After three players, the last one fills in so the hand adds to 13." : "Fix any bid or trick count, then save.";
  const btn = mode === "bids" ? "Lock in bids" : mode === "tricks" ? `Post hand ${hIdx+1}` : "Save changes";
  return `<div class="panel">
    <div class="row"><h2 class="grow">${title}</h2><button class="small ghost" data-act="cancel" id="cancel">Cancel</button></div>
    <p class="hint">${help}</p>
    <div>${rows}</div>
    ${sum}
    ${entry.error?`<div class="err">${esc(entry.error)}</div>`:""}
    <button class="primary" data-act="saveEntry" id="saveEntry">${btn}</button>
    ${mode==="edit"?`<button class="danger" data-act="delHand" id="delHand">${confirmKey==="del"?"Tap again to delete hand "+(hIdx+1):"Delete this hand"}</button>`:""}
  </div>`;
}

function autofill(){
  const set = entry.tricksSet;
  const unset = [0,1,2,3].filter(p => !set[p]);
  if (entry.auto != null && set[entry.auto]) entry.auto = null;
  if (unset.length === 1){
    const p = unset[0];
    const s = [0,1,2,3].filter(q=>q!==p).reduce((a,q)=>a+entry.tricks[q],0);
    if (s <= 13){ entry.tricks[p] = 13 - s; entry.auto = p; }
    else { entry.tricks[p] = null; entry.auto = null; }
  } else if (entry.auto != null){ entry.tricks[entry.auto] = null; entry.auto = null; }
}

function openEntry(mode, editIdx){
  if (mode === "edit"){
    const h = state.hands[editIdx];
    entry = { mode, editing:editIdx, bids:[...h.bids], blind:[...h.blind], tricks:[...h.tricks], tricksSet:[true,true,true,true], auto:null, error:"" };
  } else if (mode === "tricks"){
    entry = { mode, editing:null, bids:[...state.pending.bids], blind:[...state.pending.blind], tricks:[null,null,null,null], tricksSet:[false,false,false,false], auto:null, error:"" };
  } else {
    const pd = state.pending;
    entry = { mode:"bids", editing:null, bids: pd ? [...pd.bids] : [null,null,null,null], blind: pd ? [...pd.blind] : [false,false,false,false], tricks:[null,null,null,null], tricksSet:[false,false,false,false], auto:null, error:"" };
  }
  render();
  const panel = document.querySelector(".panel h2"); if (panel) panel.scrollIntoView({block:"start", behavior:"smooth"});
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  switch(act){
    case "rule": { const k = b.dataset.k; state.setup.rules[k] = !state.setup.rules[k]; if (k==="nil" && !state.setup.rules.nil) state.setup.rules.blind = false; if (k==="blind" && state.setup.rules.blind) state.setup.rules.nil = true; save(); render(); break; }
    case "target": state.setup.rules.target = +b.dataset.v; save(); render(); break;
    case "start": {
      const su = state.setup;
      state.teams = su.teams.map((t,i)=>({ name: t.name.trim() || (i===0?"Us":"Them"), p: t.p.map(x=>x.trim()) }));
      state.teams.forEach((t,i)=> t.p = t.p.map((x,k)=> x || `${t.name} ${k+1}`));
      state.rules = { ...su.rules }; state.dealer0 = su.firstDealer; state.hands = []; state.pending = null;
      state.phase = "play"; entry = null; save(); render(); keepAwake(); window.scrollTo({top:0}); break;
    }
    case "newHand": case "changeBids": openEntry("bids"); break;
    case "tricks": openEntry("tricks"); break;
    case "edit": openEntry("edit", +b.dataset.i); break;
    case "cancel": entry = null; render(); break;
    case "cancelHand": confirmThen("cancelHand", ()=>{ state.pending = null; save(); render(); }); break;
    case "bid": {
      const p = +b.dataset.p, v = b.dataset.v;
      if (v === "B"){ entry.bids[p] = 0; entry.blind[p] = true; }
      else { entry.bids[p] = +v; entry.blind[p] = false; }
      entry.error = ""; render(); break;
    }
    case "trick": {
      const p = +b.dataset.p, v = +b.dataset.v;
      entry.tricks[p] = v; entry.tricksSet[p] = true; entry.error = "";
      if (entry.mode === "tricks") autofill(); else entry.auto = null;
      render(); break;
    }
    case "saveEntry": {
      const m = entry.mode;
      if (m === "bids" || m === "edit"){
        const miss = [0,1,2,3].find(p => entry.bids[p] == null);
        if (miss != null){ entry.error = `Pick a bid for ${pName(state.teams,miss)}.`; render(); break; }
      }
      if (m === "bids"){
        state.pending = { bids:[...entry.bids], blind:[...entry.blind] }; entry = null; save(); render(); window.scrollTo({top:0, behavior:"smooth"}); break;
      }
      const missT = [0,1,2,3].find(p => entry.tricks[p] == null);
      if (missT != null){ entry.error = `Pick tricks taken for ${pName(state.teams,missT)}.`; render(); break; }
      const s = entry.tricks.reduce((a,v)=>a+v,0);
      if (s !== 13){ entry.error = `Tricks add up to ${s}. They need to add up to 13.`; render(); break; }
      const hand = { bids:[...entry.bids], blind:[...entry.blind], tricks:[...entry.tricks] };
      if (m === "edit") state.hands[entry.editing] = hand; else { state.hands.push(hand); state.pending = null; }
      entry = null; save(); render(); window.scrollTo({top:0, behavior:"smooth"}); break;
    }
    case "delHand": confirmThen("del", ()=>{ state.hands.splice(entry.editing,1); entry = null; save(); render(); }); break;
    case "undo": confirmThen("undo", ()=>{ state.hands.pop(); state.pending = null; entry = null; save(); render(); }); break;
    case "rematch": state.hands = []; state.pending = null; state.dealer0 = (state.dealer0 + 1) % 4; entry = null; save(); render(); break;
    case "newsetup": state.phase = "setup"; state.hands = []; state.pending = null; entry = null; save(); render(); break;
    case "newgame": confirmThen("new", ()=>{ state.phase = "setup"; state.hands = []; state.pending = null; entry = null; save(); render(); }); break;
  }
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.tname != null){ state.setup.teams[+t.dataset.tname].name = t.value; save(); refreshSeats(); }
  if (t.dataset.p != null){ const [i,k] = t.dataset.p.split("-").map(Number); state.setup.teams[i].p[k] = t.value; save(); refreshSeats(); }
});
function refreshSeats(){
  const sel = document.getElementById("first-dealer"); const dt = state.setup.teams;
  if (sel) [0,1,2,3].forEach(p => { if (sel.options[p]) sel.options[p].textContent = pName(dt,p); });
  const hint = sel && sel.parentElement.querySelector(".hint");
  if (hint) hint.textContent = `Partners sit across from each other, so seats go ${[0,1,2,3].map(p=>pName(dt,p)).join(", ")}.`;
}
document.addEventListener("change", e => { if (e.target.id === "first-dealer"){ state.setup.firstDealer = +e.target.value; save(); } });

function topOf(arr){ const m = Math.max(...arr); return { m, who: arr.map((v,i)=>i).filter(i=>arr[i]===m) }; }
function awCard(title, who, detail){ return `<div class="aw"><span class="an">${title}</span><span class="ah">${who}</span><span class="ad">${detail}</span></div>`; }
function statTable(head, rows){ return `<div class="stwrap"><table class="st"><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; }
const plural = (n, w) => `${n} ${w}${n===1?"":"s"}`;

function statsView(){
  const { details } = run(), n = details.length; if (!n) return "";
  const made = [0,0], set = [0,0], nilM = [0,0], nilF = [0,0], bags = [0,0], pen = [0,0], best = [-Infinity,-Infinity], won = [0,0];
  let bigSet = {v:0, list:[]};
  details.forEach((d,hi) => { [0,1].forEach(t => { const x = d[t];
    if (x.made === true) made[t]++; if (x.made === false){ set[t]++; if (x.cBid > bigSet.v) bigSet = {v:x.cBid, list:[[t,hi]]}; else if (x.cBid === bigSet.v) bigSet.list.push([t,hi]); }
    x.nils.forEach(nl => nl.made ? nilM[t]++ : nilF[t]++);
    bags[t] += x.bags; if (x.penalty) pen[t] += -x.penalty/100; best[t] = Math.max(best[t], x.total); });
    if (d[0].total !== d[1].total) won[d[0].total > d[1].total ? 0 : 1]++; });
  const nm = idx => [...new Set(idx)].map(t=>T(t)).join(", ");
  const mk = topOf(made), nl = topOf(nilM), bg = topOf(bags);
  const rate = t => (made[t]+set[t]) ? Math.round(100*made[t]/(made[t]+set[t]))+"%" : "–";
  return `<div class="panel"><h2>Stats</h2><div class="hl">
    ${awCard("Contract kings", mk.m?nm(mk.who):"Nobody yet", mk.m?`Made the bid ${plural(mk.m,"time")}`:"")}
    ${awCard("Nerves of steel", nl.m?nm(nl.who):"Nobody yet", nl.m?`${plural(nl.m,"nil")} made`:"No nils made yet")}
    ${awCard("Bag collector", bg.m?nm(bg.who):"Nobody yet", bg.m?`${plural(bg.m,"bag")} taken`:"No bags yet")}
    ${awCard("Biggest set", bigSet.v?nm(bigSet.list.map(x=>x[0])):"Nobody yet", bigSet.v?`Went set on a bid of ${bigSet.v}`:"Every bid made so far")}
  </div>${statTable(["", T(0), T(1)], [
    ["Hands won", won[0], won[1]], ["Bids made", made[0], made[1]], ["Went set", set[0], set[1]], ["Make rate", rate(0), rate(1)],
    ["Nils made", nilM[0], nilM[1]], ["Nils missed", nilF[0], nilF[1]], ["Bags taken", bags[0], bags[1]], ["Bag penalties", pen[0], pen[1]],
    ["Best hand", signed(best[0]), signed(best[1])]])}</div>`;
}

/* hx:js:start */
// History adapter: how a Spades game looks to the shared history module.
const HX = {
  app: "spades", title: "Spades", unit: ["hand", "hands"], sideWord: "team", lowWins: false,
  // unnamed seats: teams are "Us" / "Them", partners "<team name> 1" / "<team name> 2"
  guest: n => /^(us|them)$|^.+ [12]$/i.test(String(n).trim()),
  current(){
    if (state.phase !== "play" || !Array.isArray(state.hands) || !state.hands.length) return null;
    const T = state.teams, R = state.rules, { score, details } = run(), res = result(score);
    const per = f => [0,1].map(t => details.reduce((a, d) => a + f(d[t]), 0));
    const bid = x => [x.cBid || "", ...x.nils.map(n => n.blind ? "BN" : "N")].filter(v => v !== "").join("+") || "0";
    return {
      sides: [0,1].map(t => ({ name: tName(T,t), players: [pName(T,t), pName(T,t+2)] })),
      // each hand's total already includes a bag penalty that hit in it, so the hands add up to the app's score
      rounds: details.map(d => [d[0].total, d[1].total]),
      done: !!res, winners: res ? [res.winner] : undefined,
      labels: details.map((d,i) => `${i+1} · ${bid(d[0])}–${bid(d[1])}`),
      note: `to ${R.target}${res && res.how === "mercy" ? ` · ${tName(T, 1 - res.winner)} fell to −200` : ""}`,
      extra: {
        made: per(x => x.made === true ? 1 : 0), set: per(x => x.made === false ? 1 : 0),
        nils: per(x => x.nils.filter(n => n.made).length), nilsLost: per(x => x.nils.filter(n => !n.made).length),
        bags: per(x => x.bags), pen: per(x => x.penalty ? -x.penalty / 100 : 0),
        bigSet: [0,1].map(t => Math.max(0, ...details.map(d => d[t].made === false ? d[t].cBid : 0))),
        raw: JSON.parse(JSON.stringify({ teams: T, rules: R, dealer0: state.dealer0, hands: state.hands }))
      }
    };
  },
  detail(g){
    const x = g.extra; if (!x || !Array.isArray(x.made)) return "";
    const nm = i => { const s = g.sides[i] || { name: "", players: [] }; return esc(HX.guest(s.name) || !s.name ? s.players.join(" & ") : s.name); };
    const r = (x.raw && x.raw.rules) || {}, house = [r.bags === false && "no bag penalty", r.mercy && "a team at −200 loses"].filter(Boolean);
    const line = i => `${nm(i)}: made ${x.made[i]} of ${plural(x.made[i] + x.set[i], "bid")}` +
      (x.nils[i] + x.nilsLost[i] ? `, ${x.nils[i]} of ${plural(x.nils[i] + x.nilsLost[i], "nil")}` : "") +
      `, ${plural(x.bags[i], "bag")}${x.pen[i] ? `, ${x.pen[i]} bag penalt${x.pen[i] === 1 ? "y" : "ies"}` : ""}`;
    return `<p class="hint">Next to each hand number: both teams' bids, left column first. N is nil, BN blind nil.</p>` +
      `<p class="hint">${g.sides.map((_, i) => line(i)).join(" · ")}</p>` +
      (house.length ? `<p class="hint">House rules: ${house.join(", ")}.</p>` : "");
  },
  records(done){
    const rows = [];
    done.forEach(g => { const x = g.extra; if (!x || !Array.isArray(x.nils)) return;
      g.sides.forEach((s,i) => rows.push({ g, s, nils: x.nils[i] || 0, bags: x.bags[i] || 0, set: (x.bigSet || [])[i] || 0 })); });
    if (!rows.length) return [];
    // same wording as the module's own records: "Sharks (Sam & Alex)", or just the partners when the team name is a default
    const label = s => HX.guest(s.name) || !s.name ? (s.players.some(p => !HX.guest(p)) ? s.players.join(" & ") : s.name || "Team") : `${s.name} (${s.players.join(" & ")})`;
    const top = f => { const m = Math.max(...rows.map(r => r[f])); return { m, who: rows.filter(r => r[f] === m) }; };
    const names = w => [...new Set(w.map(r => label(r.s)))].slice(0,3).join(", ");
    const when = w => w.length === 1 ? new Date(w[0].g.date).toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" }) : `${w.length} times`;
    const out = [], nl = top("nils"), st = top("set"), bg = top("bags");
    if (nl.m) out.push(["Most nils made in a game", names(nl.who), `${nl.m} · ${when(nl.who)}`]);
    if (st.m) out.push(["Biggest set", names(st.who), `Bid ${st.m} · ${when(st.who)}`]);
    if (bg.m) out.push(["Most bags in a game", names(bg.who), `${bg.m} bags · ${when(bg.who)}`]);
    return out;
  }
};
/* ---------- game history (shared module, same in every score app) ----------
   Every game with at least one scored round is saved to localStorage as it's played, with its date,
   the teams or players, every round's scores, the final totals and the winner. A "History" screen shows
   all-time records by player name, a game log with full scorecards, and backup / restore.
   The app supplies an adapter, HX (defined just above), and this module wraps the app's save() and render(). */
const hx = (() => {
  const HKEY = HX.app + "-history-v1", BKEY = HX.app + "-last-backup";
  const unitOne = (HX.unit || ["round", "rounds"])[0], unitMany = (HX.unit || ["round", "rounds"])[1];
  const ui = { open: false, range: "all", sel: null, game: null, all: false, msg: "", confirm: null, timer: 0 };
  const e = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = n => (n < 0 ? "−" : "") + Math.abs(n).toLocaleString("en-US");
  const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + "s")}`;
  const pkey = n => String(n || "").trim().replace(/\s+/g, " ").toLowerCase();
  const guest = n => !pkey(n) || (HX.guest ? HX.guest(n) : /^(player|partner|team|side|seat) \d+$/i.test(String(n).trim()));
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const whenTxt = iso => { const d = new Date(iso); return isNaN(d) ? "Unknown date" : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) + " · " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); };
  const dayTxt = iso => { const d = new Date(iso); return isNaN(d) ? "Unknown date" : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); };

  // ----- storage -----
  const valid = g => !!g && typeof g.id === "string" && Array.isArray(g.sides) && g.sides.length >= 1 && g.sides.every(s => s && typeof s.name === "string" && Array.isArray(s.players))
    && Array.isArray(g.rounds) && g.rounds.every(r => Array.isArray(r) && r.length === g.sides.length && r.every(v => typeof v === "number" && isFinite(v)));
  function load() { try { const a = JSON.parse(localStorage.getItem(HKEY) || "[]"); return Array.isArray(a) ? a.filter(valid) : []; } catch (err) { return []; } }
  let games = load();
  function persist() { try { localStorage.setItem(HKEY, JSON.stringify(games)); } catch (err) { /* storage full or blocked */ } }
  const totalsOf = g => Array.isArray(g.totals) && g.totals.length === g.sides.length ? g.totals : g.sides.map((_, i) => g.rounds.reduce((s, r) => s + r[i], 0));
  function winnersOf(g) {
    if (Array.isArray(g.winners) && g.winners.length) return g.winners;
    const t = totalsOf(g), best = g.lowWins ? Math.min(...t) : Math.max(...t);
    return t.map((_, i) => i).filter(i => t[i] === best);
  }
  const isDone = g => !!g.done;

  // ----- keep the archive in step with the current game -----
  // A game is saved as soon as its first round is scored. Starting a new game (or undoing back to nothing)
  // detaches it; a game undone to nothing after one round is dropped, anything longer stays as unfinished.
  function sync() {
    if (typeof state !== "object" || !state) return;
    let cur = null;
    try { cur = HX.current(); } catch (err) { cur = null; }
    const has = cur && Array.isArray(cur.rounds) && cur.rounds.length > 0;
    const k = state.hxId ? games.findIndex(g => g.id === state.hxId) : -1;
    if (has) {
      if (!state.hxId) state.hxId = newId();
      const prev = k >= 0 ? games[k] : null;
      const g = {
        id: state.hxId, date: prev ? prev.date : new Date().toISOString(), updated: new Date().toISOString(),
        sides: cur.sides.map(s => ({ name: String(s.name || ""), players: (s.players || []).map(String) })),
        rounds: cur.rounds.map(r => r.map(v => +v || 0)),
        totals: (cur.totals || null) && cur.totals.map(v => +v || 0),
        done: !!cur.done, winners: cur.done && Array.isArray(cur.winners) ? cur.winners.slice() : undefined,
        lowWins: !!(cur.lowWins != null ? cur.lowWins : HX.lowWins), note: cur.note || "", labels: cur.labels || undefined, extra: cur.extra || undefined
      };
      if (!g.totals) delete g.totals;
      const before = prev ? JSON.stringify(Object.assign({}, prev, { updated: 0 })) : "";
      if (before === JSON.stringify(Object.assign({}, g, { updated: 0 }))) return;
      if (k >= 0) games[k] = g; else games.push(g);
      persist();
    } else if (state.hxId) {
      // games with no game-over of their own end when the app says so (New game): the best total wins
      let ended = false;
      try { ended = typeof HX.ended === "function" && !!HX.ended(); } catch (err) { ended = false; }
      if (k >= 0 && !games[k].done && ended) {
        const g = games[k], t = g.totals || g.sides.map((_, i) => g.rounds.reduce((a, r) => a + (+r[i] || 0), 0));
        const best = g.lowWins ? Math.min(...t) : Math.max(...t);
        g.done = true; g.winners = t.map((_, i) => i).filter(i => t[i] === best); g.updated = new Date().toISOString();
        persist();
      } else if (k >= 0 && !games[k].done && games[k].rounds.length <= 1) { games.splice(k, 1); persist(); }
      state.hxId = null;
    }
  }

  // ----- stats -----
  const byDate = () => games.slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
  function inRange(g) {
    if (ui.range === "all") return true;
    const d = new Date(g.date);
    if (isNaN(d)) return false;
    if (ui.range[0] === "y") return d.getFullYear() === +ui.range.slice(1);
    return Date.now() - d <= +ui.range.slice(1) * 864e5;
  }
  const rangeLabel = () => ui.range === "all" ? "all time" : ui.range[0] === "y" ? ui.range.slice(1) : `the last ${ui.range.slice(1)} days`;
  function sideLabel(s) {
    const named = s.players.filter(p => !guest(p));
    if (s.players.length > 1) return guest(s.name) || !s.name ? (named.length ? s.players.join(" & ") : s.name || "Team") : `${s.name} (${s.players.join(" & ")})`;
    return s.players[0] || s.name;
  }
  function shortLabel(s) {
    if (s.players.length > 1) return guest(s.name) || !s.name ? s.players.join(" & ") : s.name;
    return s.players[0] || s.name;
  }
  function career(list) {
    const map = new Map(), pairs = new Map();
    list.filter(isDone).forEach(g => {
      const t = totalsOf(g), w = winnersOf(g);
      g.sides.forEach((s, i) => {
        const won = w.includes(i);
        s.players.forEach(name => {
          if (guest(name)) return;
          const k = pkey(name);
          let p = map.get(k);
          if (!p) { p = { k, name: "", gp: 0, wins: 0, shared: 0, sum: 0, best: null, worst: null, streak: 0, bestStreak: 0 }; map.set(k, p); }
          p.name = String(name).trim();
          p.gp++; p.sum += t[i];
          const better = (a, b) => g.lowWins ? a < b : a > b;
          if (p.best == null || better(t[i], p.best)) p.best = t[i];
          if (p.worst == null || better(p.worst, t[i])) p.worst = t[i];
          if (won) { p.wins++; if (w.length > 1) p.shared++; p.streak++; p.bestStreak = Math.max(p.bestStreak, p.streak); } else p.streak = 0;
        });
        const named = s.players.filter(n => !guest(n));
        if (s.players.length === 2 && named.length === 2) {
          const pk = named.map(pkey).sort().join("|");
          const r = pairs.get(pk) || { names: named.map(n => String(n).trim()).sort((a, b) => a.localeCompare(b)), gp: 0, wins: 0 };
          r.gp++; if (won) r.wins++;
          pairs.set(pk, r);
        }
      });
    });
    const players = [...map.values()].sort((a, b) => b.wins - a.wins || b.wins / b.gp - a.wins / a.gp || a.name.localeCompare(b.name));
    const teams = [...pairs.values()].sort((a, b) => b.wins - a.wins || b.gp - a.gp || a.names.join().localeCompare(b.names.join()));
    return { players, teams };
  }
  const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "–";
  const avg = (a, b) => b ? num(Math.round(a / b)) : "–";

  // ----- views -----
  function button() { return `<button class="small ghost" data-hx="open" id="hx-open" type="button">History</button>`; }
  function note() { return `<p class="hint">Saved in History with today's date.</p>`; }
  function unbacked() { let at = 0; try { at = +localStorage.getItem(BKEY) || 0; } catch (err) { /* ignore */ } return games.filter(isDone).length - at; }
  function award(t, w, d) { return `<div class="hx-award"><span class="hx-an">${t}</span><span class="hx-aw">${w}</span><span class="hx-ad">${d}</span></div>`; }

  function recordsView(done, stats) {
    if (!done.length) return "";
    const items = [];
    const scores = [], margins = [];
    done.forEach(g => {
      const t = totalsOf(g), w = winnersOf(g);
      g.sides.forEach((s, i) => scores.push({ v: t[i], who: sideLabel(s), g }));
      if (w.length === 1 && g.sides.length > 1) {
        const others = t.filter((_, i) => i !== w[0]);
        const runner = g.lowWins ? Math.min(...others) : Math.max(...others);
        margins.push({ v: Math.abs(t[w[0]] - runner), who: sideLabel(g.sides[w[0]]), g });
      }
    });
    const pick = (list, hi) => { const m = hi ? Math.max(...list.map(x => x.v)) : Math.min(...list.map(x => x.v)); return { m, who: list.filter(x => x.v === m) }; };
    const names = who => e([...new Set(who.map(x => x.who))].slice(0, 3).join(", ")) + (new Set(who.map(x => x.who)).size > 3 ? "…" : "");
    const when = who => who.length === 1 ? dayTxt(who[0].g.date) : `${who.length} times`;
    const lowWins = done.every(g => g.lowWins);
    const best = pick(scores, !lowWins), worst = pick(scores, lowWins);
    items.push(award(lowWins ? "Lowest score" : "Highest score", names(best.who), `${num(best.m)} · ${when(best.who)}`));
    items.push(award(lowWins ? "Highest score" : "Lowest score", names(worst.who), `${num(worst.m)} · ${when(worst.who)}`));
    if (margins.length) { const mg = pick(margins, true); items.push(award("Biggest win", names(mg.who), `By ${num(mg.m)} · ${when(mg.who)}`)); }
    const most = f => stats.players.length ? Math.max(...stats.players.map(p => p[f])) : 0;
    const whoOf = (m, f) => e(stats.players.filter(p => p[f] === m).map(p => p.name).slice(0, 3).join(", "));
    const mw = most("wins"), ms = most("bestStreak"), mg2 = most("gp");
    if (stats.players.length) {
      items.push(award("Most wins", mw ? whoOf(mw, "wins") : "–", plural(mw, "win")));
      items.push(award("Longest win streak", ms ? whoOf(ms, "bestStreak") : "–", `${ms} in a row`));
      items.push(award("Most games", whoOf(mg2, "gp"), plural(mg2, "game")));
    }
    if (HX.records) { try { (HX.records(done) || []).forEach(r => items.push(award(e(r[0]), e(r[1]), e(r[2])))); } catch (err) { /* adapter records are optional */ } }
    return `<div class="panel"><h2>Records</h2><div class="hx-awards">${items.join("")}</div></div>`;
  }

  function scorecard(g) {
    const t = totalsOf(g), w = winnersOf(g), run = g.sides.map(() => 0);
    const head = `<tr><th>${e(unitOne[0].toUpperCase() + unitOne.slice(1))}</th>${g.sides.map((s, i) => `<th class="${g.done && w.includes(i) ? "hx-won" : ""}">${e(shortLabel(s))}</th>`).join("")}</tr>`;
    const body = g.rounds.map((r, ri) => {
      r.forEach((v, i) => { run[i] += v; });
      const label = g.labels && g.labels[ri] ? g.labels[ri] : String(ri + 1);
      return `<tr><td>${e(label)}</td>${r.map((v, i) => `<td>${num(v)}${g.rounds.length > 1 ? `<span class="hx-run">${num(run[i])}</span>` : ""}</td>`).join("")}</tr>`;
    }).join("");
    const foot = `<tr class="hx-tot"><td>Total</td>${t.map((v, i) => `<td class="${g.done && w.includes(i) ? "hx-won" : ""}">${num(v)}</td>`).join("")}</tr>`;
    let more = "";
    if (HX.detail) { try { more = HX.detail(g) || ""; } catch (err) { more = ""; } }
    return `<div class="hx-card"><div class="stwrap hx-wrap"><table class="st hx-sc"><thead>${head}</thead><tbody>${body}${foot}</tbody></table></div>${g.rounds.length > 1 ? `<p class="hint">Small numbers are running totals.</p>` : ""}${more}</div>`;
  }

  function logView(list, sel) {
    let rows = list.slice().reverse();
    if (sel) rows = rows.filter(g => g.sides.some(s => s.players.some(n => pkey(n) === sel.k)));
    if (!rows.length) return "";
    const shown = ui.all ? rows : rows.slice(0, 10);
    const items = shown.map(g => {
      const t = totalsOf(g), w = winnersOf(g);
      const order = t.map((_, i) => i).sort((a, b) => (g.lowWins ? t[a] - t[b] : t[b] - t[a]) || a - b);
      const current = g.id === state.hxId;
      const lead = w.map(i => e(sideLabel(g.sides[i]))).join(" &amp; ");
      let status;
      if (g.done) {
        const others = t.filter((_, i) => !w.includes(i));
        const runner = others.length ? (g.lowWins ? Math.min(...others) : Math.max(...others)) : null;
        status = w.length > 1 ? `${lead} tied` : `${lead} won${runner != null ? ` by ${num(Math.abs(t[w[0]] - runner))}` : ""}`;
      } else status = `<span class="hx-tag">${current ? "In progress" : "Unfinished"}</span> after ${plural(g.rounds.length, unitOne, unitMany)}`;
      const open = ui.game === g.id, del = "del-" + g.id;
      return `<div class="hx-game">
        <div class="hx-meta"><b>${e(whenTxt(g.date))}</b><span class="hint">${status}${g.note ? ` · ${e(g.note)}` : ""}</span></div>
        <div class="hx-scores num">${order.map(i => `<span class="${g.done && w.includes(i) ? "hx-win" : ""}">${e(sideLabel(g.sides[i]))} <b>${num(t[i])}</b></span>`).join(" · ")}</div>
        <div class="btnrow hx-btns"><button class="small" type="button" data-hx="game" data-id="${e(g.id)}" id="hx-g-${e(g.id)}">${open ? "Hide scorecard" : "Scorecard"}</button>${current ? "" : `<button class="small danger" type="button" data-hx="del" data-id="${e(g.id)}" id="hx-d-${e(g.id)}">${ui.confirm === del ? "Tap to delete" : "Delete"}</button>`}</div>
        ${open ? scorecard(g) : ""}
      </div>`;
    }).join("");
    return `<div class="panel"><h2>${sel ? `${e(sel.name)}'s games` : "Game log"}</h2><div class="hx-log">${items}</div>
      ${rows.length > 10 ? `<button class="small" type="button" data-hx="all" id="hx-all">${ui.all ? "Show fewer" : `Show all ${rows.length} games`}</button>` : ""}</div>`;
  }

  function backupView() {
    return `<div class="panel"><h2>Backup &amp; share</h2>
      <p class="hint">History is stored on this phone only. Clearing site data or switching phones loses it, so back it up now and then.</p>
      <p class="hint">To combine two phones' history, share the backup to the other phone and tap Restore there. Games it already has are skipped.</p>
      <div class="btnrow"><button type="button" data-hx="share" id="hx-share" ${games.length ? "" : "disabled"}>Share backup</button><button type="button" data-hx="download" id="hx-download" ${games.length ? "" : "disabled"}>Download</button><button type="button" data-hx="restore" id="hx-restore">Restore</button></div>
      <input type="file" id="hx-file" accept=".json,application/json" hidden>
      ${ui.msg ? `<p class="hint" role="status">${e(ui.msg)}</p>` : ""}</div>`;
  }

  function view() {
    const back = `<button class="small ghost" type="button" data-hx="back" id="hx-back">Back</button>`;
    const top = `<div class="hx-top"><div><div class="eyebrow">${e(HX.title)}</div><h1>History</h1></div>${back}</div>`;
    if (!games.length) return `<div class="hx">${top}<div class="panel"><h2>No games yet</h2><p class="hint">Every game is saved here as you play, with the date, the ${HX.sideWord || "team"}s and every ${unitOne}'s score.</p></div>${backupView()}</div>`;
    const list = byDate().filter(inRange), stats = career(list), done = list.filter(isDone);
    const sel = ui.sel && stats.players.find(p => p.k === ui.sel);
    const years = [...new Set(games.map(g => new Date(g.date).getFullYear()).filter(y => !isNaN(y)))].sort((a, b) => b - a);
    const opt = (v, l) => `<option value="${v}" ${ui.range === v ? "selected" : ""}>${l}</option>`;
    const range = `<div class="row"><label class="eyebrow" for="hx-range">Showing</label><select id="hx-range" class="grow">${opt("all", "All time")}${opt("d30", "Last 30 days")}${opt("d90", "Last 90 days")}${years.map(y => opt("y" + y, y)).join("")}</select></div>`;
    const nudge = unbacked() >= 5 ? `<div class="hx-nudge"><span class="grow">${plural(unbacked(), "finished game")} since your last backup.</span><button class="small" type="button" data-hx="download" id="hx-nudge">Back up now</button></div>` : "";
    let body;
    if (sel) {
      body = `<div class="panel"><div class="row"><h2 class="grow">${e(sel.name)}</h2><button class="small" type="button" data-hx="player" data-k="" id="hx-everyone">Everyone</button></div>
        <div class="hx-awards">${award("Games", sel.gp, `in ${rangeLabel()}`)}${award("Wins", sel.wins, `${pct(sel.wins, sel.gp)} of games${sel.shared ? `, ${sel.shared} shared` : ""}`)}${award(done.every(g => g.lowWins) ? "Best (lowest)" : "Best score", sel.best == null ? "–" : num(sel.best), "single game")}${award("Average", avg(sel.sum, sel.gp), "per game")}${award("Best streak", sel.bestStreak, "wins in a row")}</div></div>`;
    } else if (!done.length) {
      body = `<div class="panel"><h2>All-time records</h2><p class="hint">No finished games in ${rangeLabel()} yet. Unfinished games are listed below.</p></div>`;
    } else {
      const pl = stats.players, tm = stats.teams;
      body = `<div class="panel"><div><h2>Players</h2><p class="hint">${plural(done.length, "finished game")} in ${rangeLabel()}. Tap a name for their record and games.</p></div>
        ${pl.length ? `<div class="stwrap"><table class="st"><thead><tr><th>Player</th><th>GP</th><th>Wins</th><th>Win %</th><th>Avg</th><th>Best</th></tr></thead><tbody>
          ${pl.map(p => `<tr><td><button class="hx-link" type="button" data-hx="player" data-k="${e(p.k)}">${e(p.name)}</button></td><td>${p.gp}</td><td>${p.wins}</td><td>${pct(p.wins, p.gp)}</td><td>${avg(p.sum, p.gp)}</td><td>${p.best == null ? "–" : num(p.best)}</td></tr>`).join("")}
        </tbody></table></div><p class="hint">GP: games played. Wins include ties. Avg and Best are ${HX.sideWord === "player" ? "the player's" : "the team's"} final score.</p>`
        : `<p class="hint">Only unnamed players so far. Name everyone at the start of a game to track them here.</p>`}</div>
        ${tm.length ? `<div class="panel"><h2>Partnerships</h2><div class="stwrap"><table class="st"><thead><tr><th>Pair</th><th>GP</th><th>Wins</th><th>Win %</th></tr></thead><tbody>${tm.map(r => `<tr><td>${e(r.names.join(" & "))}</td><td>${r.gp}</td><td>${r.wins}</td><td>${pct(r.wins, r.gp)}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
        ${recordsView(done, stats)}`;
    }
    return `<div class="hx">${top}${nudge}${range}${body}${logView(list, sel)}${backupView()}</div>`;
  }

  // ----- backup -----
  function file() {
    const data = JSON.stringify({ app: HX.app, version: 1, exported: new Date().toISOString(), games }, null, 2);
    return new File([data], `${HX.app}-history-${new Date().toISOString().slice(0, 10)}.json`, { type: "application/json" });
  }
  function marked() { try { localStorage.setItem(BKEY, String(games.filter(isDone).length)); } catch (err) { /* ignore */ } }
  function download() {
    const f = file(), a = document.createElement("a");
    a.href = URL.createObjectURL(f); a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    marked(); ui.msg = `Downloaded ${f.name}.`;
  }
  async function share() {
    const f = file();
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      try { await navigator.share({ files: [f], title: `${HX.title} history` }); marked(); ui.msg = "Backup shared."; }
      catch (err) { if (err.name !== "AbortError") ui.msg = "Couldn't share. Try Download instead."; }
    } else { download(); ui.msg += " This browser can't share files, so it was downloaded instead."; }
  }
  function restore(text) {
    let data;
    try { data = JSON.parse(text); } catch (err) { ui.msg = `That file isn't a ${HX.title} backup.`; return; }
    const list = Array.isArray(data) ? data : data && Array.isArray(data.games) && (!data.app || data.app === HX.app) ? data.games : null;
    if (!list) { ui.msg = `That file isn't a ${HX.title} backup.`; return; }
    let added = 0, updated = 0, skipped = 0, bad = 0;
    list.forEach(g => {
      if (!valid(g)) { bad++; return; }
      const k = games.findIndex(x => x.id === g.id);
      const copy = JSON.parse(JSON.stringify(g));
      if (isNaN(new Date(copy.date))) copy.date = new Date().toISOString();
      if (k < 0) { games.push(copy); added++; }
      else if (g.id !== state.hxId && (g.done && !games[k].done || g.rounds.length > games[k].rounds.length)) { games[k] = copy; updated++; }
      else skipped++;
    });
    persist();
    ui.msg = `Added ${plural(added, "game")}.` + (updated ? ` Updated ${updated}.` : "") + (skipped ? ` ${skipped} already here.` : "") + (bad ? ` ${bad} unreadable.` : "");
  }

  // ----- events -----
  function confirmThen(key, fn) {
    if (ui.confirm === key) { clearTimeout(ui.timer); ui.confirm = null; fn(); return; }
    ui.confirm = key; render();
    clearTimeout(ui.timer);
    ui.timer = setTimeout(() => { ui.confirm = null; if (ui.open) render(); }, 3500);
  }
  document.addEventListener("click", ev => {
    const b = ev.target.closest("[data-hx]"); if (!b) return;
    const a = b.dataset.hx;
    if (a === "open") { ui.open = true; ui.msg = ""; render(); window.scrollTo(0, 0); }
    else if (a === "back") { ui.open = false; ui.sel = null; ui.game = null; render(); window.scrollTo(0, 0); }
    else if (a === "game") { ui.game = ui.game === b.dataset.id ? null : b.dataset.id; render(); }
    else if (a === "del") confirmThen("del-" + b.dataset.id, () => { games = games.filter(g => g.id !== b.dataset.id); persist(); render(); });
    else if (a === "all") { ui.all = !ui.all; render(); }
    else if (a === "player") { ui.sel = b.dataset.k || null; ui.all = false; render(); window.scrollTo(0, 0); }
    else if (a === "download") { download(); render(); }
    else if (a === "share") share().then(render);
    else if (a === "restore") { const f = document.getElementById("hx-file"); if (f) f.click(); }
  });
  document.addEventListener("change", ev => {
    if (ev.target.id === "hx-range") { ui.range = ev.target.value; ui.sel = null; render(); }
    if (ev.target.id === "hx-file" && ev.target.files && ev.target.files[0]) ev.target.files[0].text().then(restore, () => { ui.msg = "Couldn't read that file."; }).then(render);
  });

  return { sync, view, button, note, isOpen: () => ui.open, games: () => games };
})();
// Wrap the app's own save() and render(): every save keeps the archive current, and History takes over the screen while open.
{
  const appSave = save, appRender = render;
  save = function () { hx.sync(); return appSave.apply(this, arguments); };
  render = function () {
    if (hx.isOpen()) { document.getElementById("app").innerHTML = hx.view(); return; }
    return appRender.apply(this, arguments);
  };
}
// A game already on this phone when History arrived is saved right away (dated now).
hx.sync(); save();
/* hx:js:end */
render();
keepAwake();
</script>
